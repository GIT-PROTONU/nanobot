[workspace]
name = "nano-robot"
version = "0.1.0"
description = "Lightweight ROS 2 Humble robot stack for a NanoPi NEO Plus2 (H5): Roborock LDS, wheel encoders, I2C OLED, web control."
authors = ["ib <ib.elfaramawy@gmail.com>"]
channels = ["conda-forge", "robostack-staging"]
# linux-aarch64 = the board (Armbian on the H5). linux-64 kept so you can develop
# the non-hardware bits (msgs, web, sim) on a desktop too.
platforms = ["linux-aarch64", "linux-64"]

# rmw_zenoh is dramatically lighter on RAM/discovery than the default FastDDS,
# which matters on the 1 GB H5. Set once here so every task/shell inherits it.
[activation.env]
RMW_IMPLEMENTATION = "rmw_zenoh_cpp"
ROS_DOMAIN_ID = "0"
# rmw_zenoh logs through this; keep it quiet on the constrained board.
RUST_LOG = "warn"
# Build with Ninja (shipped) rather than the default "Unix Makefiles" generator,
# which would require a separate `make` package that isn't in the env.
CMAKE_GENERATOR = "Ninja"

[dependencies]
# --- ROS 2 Humble core (ros-base = no Rviz/Gazebo/GUI, keeps the footprint small) ---
ros-humble-ros-base = "*"
ros-humble-rmw-zenoh-cpp = "*"
# Navigation: Nav2 (individual sub-packages, NOT the `navigation2` meta — that
# pulls AMCL/map_server/etc. we never run) + slam_toolbox (mapping + map->odom
# TF + /map), replacing the custom slam_nav / robot_localization EKF stack.
# All verified to resolve on linux-aarch64 (robostack-staging, 2026-09-14).
ros-humble-nav2-msgs = "*"
ros-humble-nav2-util = "*"
ros-humble-nav2-core = "*"
ros-humble-nav2-costmap-2d = "*"
ros-humble-nav2-behavior-tree = "*"
ros-humble-nav2-planner = "*"
ros-humble-nav2-controller = "*"
ros-humble-nav2-bt-navigator = "*"
ros-humble-nav2-behaviors = "*"
ros-humble-nav2-lifecycle-manager = "*"
ros-humble-nav2-regulated-pure-pursuit-controller = "*"
ros-humble-nav2-navfn-planner = "*"
ros-humble-slam-toolbox = "*"
# NOTE: rosbridge is GONE. The browser talks only to web_control's own HTTP server
# (SSE /telemetry + POST /publish|/param|/drive) — see web_control/telemetry.py.
# common_interfaces (sensor_msgs/nav_msgs/geometry_msgs) + tf2 ship with ros-base.
ros-humble-tf-transformations = "*"
# NOTE: no micro-ROS agent dependency. The ESP32 coprocessor now talks NATIVE
# zenoh-pico over a direct serial link (no micro-ROS, no Fast-DDS) — a serial-capable
# zenohd joins it to the rmw_zenoh graph. See firmware/nanobot_coprocessor. (Aside:
# ros-humble-micro-ros-agent also vanished from robostack-staging/-humble, so it
# couldn't be required here anyway.)

# --- colcon / C++ build tooling (for robot_msgs) ---
colcon-common-extensions = "*"
# ROS 2 Humble's ament/rosidl CMake modules predate CMake 4 (its FindPython
# rewrite breaks rosidl_generator_py), so pin to the 3.x series.
cmake = ">=3.22,<4"
ninja = "*"
cxx-compiler = "*"
pkg-config = "*"

# NOTE: NO Rust/clang/LLVM toolchain here on purpose. The LDS is driven by the
# pure-Python `lds_driver_py`; the old Rust `lds_driver` node was abandoned and
# removed. Do NOT add `rust`, `clang`, or `libclang` — that toolchain pulled
# ~1.6 GB into the env on this 7 GB board.

# --- Python hardware libraries (pure-python, available on conda-forge) ---
pyserial = "*"          # serial access for the LDS (lds_driver_py) + IMU (imu_driver)
pip = ">=26.2.1,<27"

# --- Dev-PC-only: Gazebo simulation + RViz (see scripts/sim_run.sh) ---------------
# linux-64 ONLY (a [target.*] section, not [dependencies]) so none of this ever
# resolves onto the board (linux-aarch64) — same "don't bloat the 1 GB/7 GB board"
# discipline as the rust/clang ban above. `ros-humble-ros-base` (used for
# everyone, incl. the board) deliberately excludes RViz/Gazebo. Note this is
# Gazebo SIM (formerly "Ignition", via ros_gz) not Gazebo Classic:
# robostack-staging doesn't cleanly ship gazebo_ros_pkgs for Humble, but DOES
# ship ros-gz-* (verified against the anaconda.org API) — also the
# actively-maintained upstream path now that Gazebo Classic is EOL.
[target.linux-64.dependencies]
ros-humble-rviz2 = "*"
ros-humble-ros-gz-sim = "*"
ros-humble-ros-gz-bridge = "*"
ros-humble-ros-gz-image = "*"
ros-humble-xacro = "*"
ros-humble-robot-state-publisher = "*"
ros-humble-joint-state-publisher = "*"

[pypi-dependencies]
luma-oled = "*"         # SSD1306 OLED over I2C
# (gpiod removed: wheel encoders now decode on the ESP32 coprocessor, not GPIO.)
# Statechart interpreter for the behaviour layer (src/behavior). Pure-python (~5-8 MB),
# no native build — safe on the 1 GB / 7 GB board. The behavior node degrades to a
# no-op if it's missing, so an un-resolved board still boots the rest of the stack.
sismic = ">=1.6"
# NOTE: nanobot-brain is deliberately NOT a pypi path-dependency here — the board
# keeps it as a PYTHONPATH copy at <repo>/brain/src (a relative path dep would make
# every board `pixi run` try to resolve a checkout it doesn't have). Dev PC: set up
# once with `pixi run brain`.

[tasks]
# Build the colcon workspace (msgs + all python packages). See scripts/build.sh
# for why the explicit Python hints are needed under RoboStack.
build = "bash scripts/build.sh"
# Dev-PC one-shot: editable-install the sibling nanobot-brain checkout into the pixi
# env (mood_node/web_server/dev_webui import nanobot_brain.* — see the NOTE above).
brain = "pip install -e ../nanobot-brain"
# (No `build-lds`/`build-all`: the Rust LDS node is abandoned and its toolchain is
# intentionally not installed — see the dependencies note above.)

# rmw_zenoh needs its router running for discovery. Start it (own terminal / service).
zenohd = "ros2 run rmw_zenoh_cpp rmw_zenohd"

# Bring up the full robot (real hardware; ros2-launch debug alternative to the systemd
# units that run in production — see robot_bringup/launch/bringup.launch.py).
bringup = { cmd = "bash -c 'source install/setup.bash && ros2 launch robot_bringup bringup.launch.py'", depends-on = ["build"] }

# Dev-PC-only: the same node graph as `bringup`, but with lds_driver_py/imu_driver/the
# ESP32 replaced by Gazebo Sim + sim_hardware, plus RViz. See scripts/sim_run.sh.
sim = { cmd = "bash -c 'source install/setup.bash && ros2 launch robot_bringup bringup.launch.py sim:=true rviz:=true'", depends-on = ["build"] }

# Dev-PC-only: RViz watching the REAL robot live over the shared zenoh graph (robot runs
# its own systemd stack unchanged) -- NOT a simulation. See scripts/rviz_remote.sh.
visualize = { cmd = "bash -c 'source install/setup.bash && ros2 launch robot_bringup visualize.launch.py'", depends-on = ["build"] }

# Web control page only (handy for UI dev). Web UI + telemetry on :8080.
web = { cmd = "bash -c 'source install/setup.bash && ros2 launch web_control web.launch.py'", depends-on = ["build"] }
# End-to-end smoke test of the browser gateway + hubs (the telemetry-frame contract,
# publish/param whitelists, vitals blob, SIGTERM path). Run before deploying.
smoke = { cmd = "bash -c 'source install/setup.bash && python scripts/smoke_test.py'", depends-on = ["build"] }

# Convenience: open a shell with everything sourced.
shell = "bash -c 'source install/setup.bash 2>/dev/null; exec bash'"
